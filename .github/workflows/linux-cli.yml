name: Linux CLI

on:
  workflow_dispatch:
    inputs:
      static_sdk_url:
        description: "Optional Swift Static Linux SDK artifactbundle URL"
        required: false
        type: string
      static_sdk_checksum:
        description: "Checksum for static_sdk_url"
        required: false
        type: string
      static_sdk_id:
        description: "Swift SDK identifier"
        required: false
        default: "x86_64-swift-linux-musl"
        type: string
  pull_request:
  push:
    branches:
      - main

jobs:
  native-linux-cli:
    name: Native Linux x86_64 CLI Smoke
    runs-on: ubuntu-24.04
    container: swift:6.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CLI Product
        run: swift build -c release --product liquid

  static-linux-cli:
    name: Static Linux x86_64 CLI Artifact Gate
    if: github.event_name == 'workflow_dispatch' && inputs.static_sdk_url != '' && inputs.static_sdk_checksum != ''
    runs-on: ubuntu-24.04
    container: swift:6.3
    env:
      RHOE_LINUX_SDK_ID: ${{ inputs.static_sdk_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Static Linux SDK
        run: swift sdk install "${{ inputs.static_sdk_url }}" --checksum "${{ inputs.static_sdk_checksum }}"

      - name: Build Static CLI Product
        run: bash Scripts/CI/build-linux-cli.sh
