# SwiftLint Configuration for RhoeLiquid
# High-quality code standards for a frontier-level project

# Paths
included:
  - Sources
  - Tests
  - RhoeLiquidNativeService/Sources
  - RhoeLiquidNativeService/Tests
  - WordAddin
  - Examples

excluded:
  - .build
  - .swiftpm
  - .archive
  - Documentation
  - Scripts
  - Benchmarks/Results
  - Package.swift
  - Tests/*/Fixtures
  - Tests/*/Templates

# Rule Configuration
opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - discouraged_object_literal
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_header
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - function_default_parameter_at_end
  - identical_operands
  - implicit_return
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - nimble_operator
  - nslocalizedstring_key
  - number_separator
  - object_literal
  - operator_usage_whitespace
  - optional_enum_case_matching
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_interface_builder
  - prohibited_super_call
  - quick_discouraged_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - raw_value_for_camel_cased_codable_enum
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - required_enum_case
  - single_test_class
  - sorted_first_last
  - sorted_imports
  - static_operator
  - strong_iboutlet
  - switch_case_on_newline
  - toggle_bool
  - trailing_closure
  - type_contents_order
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - unused_declaration
  - unused_import
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - weak_delegate
  - xct_specific_matcher
  - yoda_condition

disabled_rules:
  - todo # We use TODOs for tracking
  - line_length # We have some long documentation comments
  - file_length # Some core files are necessarily large
  - type_body_length # Some types have many methods
  - function_body_length # Some parsing functions are complex

# Rule Parameters
identifier_name:
  min_length: 2
  max_length: 50
  allowed_symbols: ["_"]
  validates_start_with_lowercase: false
  excluded:
    - id
    - i
    - j
    - k
    - x
    - y
    - z
    - op
    - lhs
    - rhs
  
type_name:
  min_length: 3
  max_length: 50
  
force_cast: error
force_try: error
force_unwrapping: error

function_parameter_count:
  warning: 6
  error: 8

cyclomatic_complexity:
  warning: 15
  error: 20
  ignores_case_statements: true

nesting:
  type_level:
    warning: 2
    error: 3
  function_level:
    warning: 3
    error: 5

file_header:
  required_pattern: |
    \/\/
    \/\/  .*\.swift
    \/\/  .*
    \/\/
    \/\/  Created as part of RhoeLiquid
    \/\/  .*
    \/\/

type_contents_order:
  order:
    - case
    - type_alias
    - associated_type
    - type_property
    - instance_property
    - ib_outlet
    - ib_inspectable
    - initializer
    - type_method
    - view_life_cycle_method
    - ib_action
    - other_method
    - subscript

# Custom Rules
custom_rules:
  no_print_statements:
    name: "No Print Statements"
    regex: '^\s*print\('
    message: "Use logging instead of print statements"
    severity: warning
    
  prefer_async_await:
    name: "Prefer Async/Await"
    regex: 'completion:\s*@escaping\s*\('
    message: "Consider using async/await instead of completion handlers"
    severity: warning
    
  mark_sections:
    name: "MARK Sections"
    regex: '^(class|struct|enum|protocol|extension)\s+'
    message: "Consider adding MARK comments to organize code sections"
    severity: hint

# Reporter
reporter: "xcode" # Use "json" for CI integration